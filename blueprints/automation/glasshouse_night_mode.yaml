blueprint:
  name: Glasshouse night mode
  description: >-
    Turns the Glasshouse night screen on at bedtime or after Good Night, off in the
    morning, and off when someone walks up to the wall tablet (back on once the motion
    sensors have all been clear for the idle time). Requires Home Assistant 2024.10 or newer.
  domain: automation
  source_url: https://github.com/ammonlee/glasshouse-card/blob/main/blueprints/automation/glasshouse_night_mode.yaml
  input:
    night_boolean:
      name: Night mode switch
      selector: { entity: { domain: input_boolean } }
    bedtime:
      name: Bedtime
      default: "22:30:00"
      selector: { time: {} }
    wake_time:
      name: Wake time
      default: "06:30:00"
      selector: { time: {} }
    good_night_script:
      name: Good Night script (optional)
      default: []
      selector: { entity: { domain: script, multiple: true } }
    motion_sensor:
      name: Motion sensor near the tablet (optional)
      default: []
      selector: { entity: { domain: binary_sensor, device_class: [motion, occupancy, presence], multiple: true } }
    idle_minutes:
      name: Back to night after this many idle minutes
      default: 2
      selector: { number: { min: 1, max: 30, unit_of_measurement: min } }

mode: restart
variables:
  night: !input night_boolean
  bedtime: !input bedtime
  wake_time: !input wake_time
  motion: !input motion_sensor
trigger:
  - trigger: time
    at: !input bedtime
    id: bedtime
  - trigger: time
    at: !input wake_time
    id: wake
  - trigger: state
    entity_id: !input good_night_script
    to: "on"
    id: bedtime
  - trigger: state
    entity_id: !input motion_sensor
    to: "on"
    id: motion
condition: []
action:
  - choose:
      - conditions: "{{ trigger.id == 'bedtime' }}"
        sequence:
          - action: input_boolean.turn_on
            target: { entity_id: !input night_boolean }
      - conditions: "{{ trigger.id == 'wake' }}"
        sequence:
          - action: input_boolean.turn_off
            target: { entity_id: !input night_boolean }
      # Don't gate this branch on is_state(night, 'on'): mode: restart means a second
      # motion event while waiting below cancels and restarts this same sequence, so by
      # the time it re-evaluates, night mode is already off from the first run. Checking
      # only "are we in night hours" lets each restart turn the screen off again and wait.
      - conditions:
          - "{{ trigger.id == 'motion' }}"
          - >-
            {% set t = now().strftime('%H:%M:%S') %}
            {{ (t >= bedtime or t < wake_time) if bedtime > wake_time else (t >= bedtime and t < wake_time) }}
        sequence:
          - action: input_boolean.turn_off
            target: { entity_id: !input night_boolean }
          # Stay awake while anyone is still there: wait until every motion sensor is clear,
          # then idle_minutes more. Any new motion ("on") restarts this sequence (mode: restart),
          # so night comes back only after the sensors have been clear for idle_minutes.
          # (A wait_template, not a wait_for_trigger: a trigger would never fire if the sensor
          # had already gone clear before the wait started, leaving the screen awake all night.)
          - wait_template: >-
              {{ expand(motion) | selectattr('state', 'eq', 'on') | list | count == 0 }}
          - delay:
              minutes: !input idle_minutes
          - action: input_boolean.turn_on
            target: { entity_id: !input night_boolean }
